<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ჩემი იმპერია — პერსონალური სეიფი</title>
    <style>
        :root {
            --bg-color: #0f1115;
            --card-bg: #1a1d24;
            --accent-color: #10b981;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #2d3748;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        h1 {
            font-size: 1.5rem;
            color: var(--accent-color);
            letter-spacing: 0.5px;
        }

        .btn {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        /* Categories & Grid */
        .category-section {
            margin-bottom: 30px;
        }

        .category-title {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: var(--text-main);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 16px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        .card h3 {
            font-size: 1rem;
            margin-bottom: 8px;
        }

        .card a {
            color: var(--accent-color);
            text-decoration: none;
            font-size: 0.9rem;
            word-break: break-all;
            margin-bottom: 12px;
            display: block;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-color);
            padding-top: 10px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .like-btn {
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .share-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.85rem;
        }

        .share-btn:hover {
            color: var(--text-main);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            border: 1px solid var(--border-color);
        }

        .modal-content h2 {
            font-size: 1.2rem;
            margin-bottom: 16px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 6px;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>⚡ ჩემი იმპერია</h1>
            <button class="btn" onclick="openModal()">+ დამატება</button>
        </header>

        <div id="content-area">
            <!-- აქ დინამიკურად ჩაჯდება კატეგორიები და ბარათები -->
        </div>
    </div>

    <!-- მოდალური ფანჯარა დამატებისთვის -->
    <div class="modal" id="addModal">
        <div class="modal-content">
            <h2>ახალი კონტენტის დამატება</h2>
            <div class="form-group">
                <label>კატეგორია (მაგ: ჯანმრთელობა, პოკერი)</label>
                <input type="text" id="catInput" placeholder="შეიყვანეთ კატეგორიის სახელი">
            </div>
            <div class="form-group">
                <label>სათაური / აღწერა</label>
                <input type="text" id="titleInput" placeholder="მაგ: ფრჩხილის სოკოს მკურნალობა">
            </div>
            <div class="form-group">
                <label>ბმული (URL)</label>
                <input type="text" id="urlInput" placeholder="https://youtube.com/...">
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeModal()">გაუქმება</button>
                <button class="btn" onclick="saveItem()">შენახვა</button>
            </div>
        </div>
    </div>

    <script>
        // საწყისი მონაცემები (ადგილობრივი მეხსიერებიდან ან ცარიელი)
        let empireData = JSON.parse(localStorage.getItem('my_empire')) || {
            "ჯანმრთელობა": [
                { id: 1, title: "ფრჩხილის სოკოს მკურნალობა", url: "https://youtube.com", likes: 2 },
                { id: 2, title: "დილის ვარჯიში", url: "https://youtube.com", likes: 5 }
            ],
            "პოკერი": [
                { id: 3, title: "ბედ ბიათ ჯეკპოტები", url: "https://youtube.com", likes: 1 }
            ]
        };

        function render() {
            const container = document.getElementById('content-area');
            container.innerHTML = '';

            for (let category in empireData) {
                let section = document.createElement('div');
                section.className = 'category-section';
                
                let titleDiv = document.createElement('div');
                titleDiv.className = 'category-title';
                titleDiv.innerHTML = `<span>📂 ${category}</span> <button class="share-btn" onclick="shareCategory('${category}')">🔗 გაზიარება</button>`;
                section.appendChild(titleDiv);

                let grid = document.createElement('div');
                grid.className = 'grid';

                empireData[category].forEach(item => {
                    let card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div>
                            <h3>${item.title}</h3>
                            <a href="${item.url}" target="_blank">${item.url}</a>
                        </div>
                        <div class="card-footer">
                            <button class="like-btn" onclick="likeItem('${category}', ${item.id})">
                                ❤ <span>${item.likes}</span>
                            </button>
                            <button class="share-btn" onclick="shareItem('${item.title}', '${item.url}')">გაგზავნა</button>
                        </div>
                    `;
                    grid.appendChild(card);
                });

                section.appendChild(grid);
                container.appendChild(section);
            }
        }

        function openModal() {
            document.getElementById('addModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('addModal').style.display = 'none';
        }

        function saveItem() {
            let cat = document.getElementById('catInput').value.trim() || "ზოგადი";
            let title = document.getElementById('titleInput').value.trim();
            let url = document.getElementById('urlInput').value.trim();

            if (!title || !url) {
                alert("გთხოვთ შეავსოთ სათაური და ბმული!");
                return;
            }

            if (!empireData[cat]) {
                empireData[cat] = [];
            }

            empireData[cat].push({
                id: Date.now(),
                title: title,
                url: url,
                likes: 0
            });

            localStorage.setItem('my_empire', JSON.stringify(empireData));
            closeModal();
            render();

            // ინფუთების გასუფთავება
            document.getElementById('titleInput').value = '';
            document.getElementById('urlInput').value = '';
        }

        function likeItem(cat, id) {
            let item = empireData[cat].find(i => i.id === id);
            if (item) {
                item.likes += 1;
                localStorage.setItem('my_empire', JSON.stringify(empireData));
                render();
            }
        }

        function shareCategory(cat) {
            navigator.clipboard.writeText(window.location.href);
            alert(`"${cat}" კატეგორიის ბმული დაკოპირდა! შეგიძლიათ გაუგზავნოთ მეგობარს.`);
        }

        function shareItem(title, url) {
            if (navigator.share) {
                navigator.share({
                    title: title,
                    url: url
                }).catch(() => {});
            } else {
                navigator.clipboard.writeText(url);
                alert(`ბმული დაკოპირდა: ${title}`);
            }
        }

        // პირველადი ჩატვირთვა
        render();
    </script>
</body>
</html>
