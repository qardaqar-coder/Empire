<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>იმპერია — ვიზუალური ბუქმარქები</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- LZ-String URL-ში მონაცემების კომპაქტურად ჩასაწერად -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
  <!-- Google Fonts: Noto Sans Georgian & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Georgian:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-primary: #0e110f;
      --bg-card: #181c19;
      --bg-card-hover: #1f2420;
      --bg-input: #161a17;
      --border-subtle: #252b27;
      --text-primary: #f1f5f2;
      --text-secondary: #8c968e;
      --accent-green: #10b981;
      --pill-bg: #1e2320;
      --modal-backdrop: rgba(0, 0, 0, 0.78);
    }

    html.light-theme {
      --bg-primary: #f4f6f4;
      --bg-card: #ffffff;
      --bg-card-hover: #f9fbf9;
      --bg-input: #ffffff;
      --border-subtle: #dfe5e0;
      --text-primary: #141a16;
      --text-secondary: #5c6860;
      --accent-green: #059669;
      --pill-bg: #eef2ef;
      --modal-backdrop: rgba(15, 23, 18, 0.45);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: 'Noto Sans Georgian', 'Inter', sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      transition: background-color 0.25s ease, color 0.25s ease;
      overflow-x: hidden;
    }

    .theme-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-subtle);
      transition: transform 0.16s ease, background-color 0.2s ease, border-color 0.2s ease;
    }

    .theme-card:active {
      transform: scale(0.97);
    }

    .theme-input {
      background-color: var(--bg-input);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
    }

    .theme-input::placeholder {
      color: var(--text-secondary);
    }

    .theme-pill {
      background-color: var(--pill-bg);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
    }

    /* დინამიური ბადე: 4, 3 ან 2 კვადრატი სიგანეზე */
    .imperia-grid {
      display: grid;
      gap: 14px;
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .imperia-grid.cols-3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .imperia-grid.cols-2 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    @media (min-width: 768px) {
      .imperia-grid {
        max-width: 760px;
        margin-left: auto;
        margin-right: auto;
      }
    }

    /* კვადრატული ბარათი */
    .square-box {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .cols-2 .square-box {
      border-radius: 24px;
    }

    /* ფერადი შიდა ჩრდილი ფოლდერისთვის */
    .folder-glow {
      width: 54%;
      height: 54%;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ტოსტ შეტყობინება */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background-color: #10b981;
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
      z-index: 100;
      opacity: 0;
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.25s ease;
      pointer-events: none;
      white-space: nowrap;
    }

    #toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body class="min-h-screen pb-20">

  <!-- ზედა პანელი (Top Bar) -->
  <header class="sticky top-0 z-30 backdrop-blur-md bg-opacity-90 px-3 pt-3 pb-2.5 border-b border-transparent" style="background-color: color-mix(in srgb, var(--bg-primary) 88%, transparent);">
    <div class="max-w-[760px] mx-auto flex items-center gap-2">
      <!-- მარცხენა + ღილაკი -->
      <button onclick="openCreateModal()" title="დამატება" class="theme-card w-10 h-10 rounded-full flex items-center justify-center shrink-0 cursor-pointer hover:border-emerald-500/50">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
        </svg>
      </button>

      <!-- გაზიარების / ლინკის კოპირების ღილაკი -->
      <button onclick="copyShareLink()" title="იმპერიის ლინკის კოპირება" class="theme-card w-10 h-10 rounded-full flex items-center justify-center shrink-0 cursor-pointer hover:border-emerald-500/50 text-emerald-500">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13.19 8.688a4.5 4.5 0 011.242 7.244l-4.5 4.5a4.5 4.5 0 01-6.364-6.364l1.757-1.757m13.35-.622l1.757-1.757a4.5 4.5 0 00-6.364-6.364l-4.5 4.5a4.5 4.5 0 001.242 7.244" />
        </svg>
      </button>

      <!-- შუა ძიების ველი -->
      <div class="relative flex-1 min-w-0">
        <svg class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none" style="color: var(--text-secondary);" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35m1.85-5.15a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
        <input
          id="searchInput"
          type="text"
          oninput="handleSearch(this.value)"
          placeholder="ძიება..."
          class="theme-input w-full h-10 pl-9 pr-3 rounded-full text-sm focus:outline-none focus:border-emerald-500 transition-colors"
        />
      </div>

      <!-- ბადის ზომის გადამრთველი (4 -> 3 -> 2 კვადრატი) -->
      <button onclick="cycleGridCols()" id="gridToggleBtn" title="კვადრატების ზომის შეცვლა (4 / 3 / 2)" class="theme-card h-10 px-2.5 rounded-full flex items-center justify-center gap-1 shrink-0 cursor-pointer text-xs font-semibold hover:border-emerald-500/50">
        <svg class="w-3.5 h-3.5 text-emerald-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
          <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
          <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
          <rect x="14" y="14" width="7" height="7" rx="1.5"></rect>
        </svg>
        <span id="gridColLabel">4</span>
      </button>

      <!-- დღის და ღამის რეჟიმის გადამრთველი -->
      <button onclick="toggleTheme()" id="themeToggleBtn" title="დღის / ღამის რეჟიმი" class="theme-card w-10 h-10 rounded-full flex items-center justify-center shrink-0 cursor-pointer hover:border-emerald-500/50">
        <!-- მზის აიქონი (ჩანს ღამის რეჟიმში) -->
        <svg id="sunIcon" class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="4"></circle>
          <path stroke-linecap="round" d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32l1.41-1.41"></path>
        </svg>
        <!-- მთვარის აიქონი (ჩანს დღის რეჟიმში) -->
        <svg id="moonIcon" class="w-4 h-4 text-slate-700 hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"></path>
        </svg>
      </button>

      <!-- მარჯვენა მწვანე + ღილაკი -->
      <button onclick="openCreateModal()" title="ახლის დამატება" class="theme-card w-10 h-10 rounded-full flex items-center justify-center shrink-0 cursor-pointer text-emerald-500 hover:border-emerald-500/50">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
        </svg>
      </button>
    </div>

    <!-- ნავიგაციის პანელი (Breadcrumb / უკან დაბრუნება როცა კატეგორიაში ვართ) -->
    <div id="breadcrumbBar" class="max-w-[760px] mx-auto mt-2.5 hidden items-center justify-between px-1">
      <div class="flex items-center gap-2 overflow-x-auto no-scrollbar">
        <button onclick="navigateUp()" class="theme-card px-3 py-1.5 rounded-full text-xs font-medium flex items-center gap-1.5 cursor-pointer hover:border-emerald-500/50 shrink-0">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
          </svg>
          <span>უკან</span>
        </button>
        <div id="breadcrumbTrail" class="flex items-center gap-1.5 text-xs font-medium truncate" style="color: var(--text-secondary);"></div>
      </div>

      <span id="sharedBadge" class="hidden text-[11px] px-2.5 py-1 rounded-full bg-emerald-500/15 text-emerald-400 font-medium shrink-0">
        გაზიარებული ლინკი
      </span>
    </div>
  </header>

  <!-- მთავარი კონტენტი / ბადე -->
  <main class="px-3.5 pt-3">
    <!-- ინფორმაციული ზოლი გაზიარებულ რეჟიმში -->
    <div id="sharedNotice" class="max-w-[760px] mx-auto mb-3 hidden items-center justify-between gap-2 px-3.5 py-2.5 rounded-2xl theme-card text-xs">
      <div class="flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        <span>გახსნილია გაზიარებული იმპერია — ნებისმიერი ცვლილება ავტომატურად განაახლებს ლინკს.</span>
      </div>
      <button onclick="resetToBlank()" class="text-emerald-500 font-semibold hover:underline shrink-0 cursor-pointer">
        გასუფთავება
      </button>
    </div>

    <!-- ბარათების ბადე -->
    <div id="itemsGrid" class="imperia-grid"></div>

    <!-- ცარიელი მდგომარეობა -->
    <div id="emptyState" class="hidden max-w-[400px] mx-auto text-center py-16 px-4">
      <div class="w-16 h-16 rounded-2xl theme-card mx-auto mb-4 flex items-center justify-center text-emerald-500">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12.75V12A2.25 2.25 0 014.5 9.75h15A2.25 2.25 0 0121.75 12v.75m-8.69-6.44l-2.12-2.12a1.5 1.5 0 00-1.061-.44H4.5A2.25 2.25 0 002.25 6v12a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9a2.25 2.25 0 00-2.25-2.25h-5.379a1.5 1.5 0 01-1.06-.44z" />
        </svg>
      </div>
      <h3 class="text-base font-semibold mb-1">ჯერ არაფერია დამატებული</h3>
      <p class="text-xs mb-4" style="color: var(--text-secondary);">დააჭირე ზედა + ღილაკს და შექმენი კატეგორია ან შეინახე სასურველი ლინკი.</p>
      <button onclick="openCreateModal()" class="px-5 py-2.5 rounded-full bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold cursor-pointer transition-colors">
        + ახლის დამატება
      </button>
    </div>
  </main>

  <!-- დამატების / რედაქტირების მოდალური ფანჯარა -->
  <div id="itemModal" class="fixed inset-0 z-50 hidden items-center justify-center p-4" style="background-color: var(--modal-backdrop); backdrop-filter: blur(6px);">
    <div class="theme-card w-full max-w-md rounded-3xl p-5 shadow-2xl relative animate-fadeIn">
      <div class="flex items-center justify-between mb-4">
        <h2 id="modalTitle" class="text-base font-bold">ახლის დამატება</h2>
        <button onclick="closeModal()" class="w-8 h-8 rounded-full theme-pill flex items-center justify-center cursor-pointer">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <!-- ტიპის არჩევა (კატეგორია / ქვეკატეგორია ან ლინკი) -->
      <div id="typeSelectorWrap" class="grid grid-cols-2 gap-2 p-1 rounded-2xl mb-4" style="background-color: var(--bg-primary); border: 1px solid var(--border-subtle);">
        <button type="button" id="typeFolderBtn" onclick="setModalType('folder')" class="py-2 rounded-xl text-xs font-semibold transition-all cursor-pointer bg-emerald-600 text-white">
          კატეგორია
        </button>
        <button type="button" id="typeLinkBtn" onclick="setModalType('link')" class="py-2 rounded-xl text-xs font-semibold transition-all cursor-pointer" style="color: var(--text-secondary);">
          ლინკი (საიტი)
        </button>
      </div>

      <form onsubmit="saveItemForm(event)" class="space-y-3.5">
        <!-- დასახელება -->
        <div>
          <label class="block text-xs font-medium mb-1.5" style="color: var(--text-secondary);">დასახელება</label>
          <input
            id="itemTitleInput"
            type="text"
            required
            placeholder="მაგ: მუსიკა, ფილმები, YouTube..."
            class="theme-input w-full px-3.5 py-2.5 rounded-xl text-sm focus:outline-none focus:border-emerald-500"
          />
        </div>

        <!-- URL ველი (მხოლოდ ლინკისთვის) -->
        <div id="urlFieldWrap" class="hidden">
          <label class="block text-xs font-medium mb-1.5" style="color: var(--text-secondary);">ვებ-მისამართი (URL)</label>
          <input
            id="itemUrlInput"
            type="text"
            placeholder="https://example.com"
            class="theme-input w-full px-3.5 py-2.5 rounded-xl text-sm focus:outline-none focus:border-emerald-500"
          />
        </div>

        <!-- ფერის არჩევა -->
        <div>
          <label class="block text-xs font-medium mb-1.5" style="color: var(--text-secondary);">აიქონის ფერი</label>
          <div id="colorPalette" class="flex items-center gap-2.5 flex-wrap">
            <!-- JS-ით შეივსება -->
          </div>
        </div>

        <!-- ლოკალური ფოტოს ატვირთვა (მხოლოდ ამ მოწყობილობაზე IndexedDB-ში) -->
        <div class="pt-1 border-t" style="border-color: var(--border-subtle);">
          <div class="flex items-center justify-between mb-1.5">
            <label class="text-xs font-medium" style="color: var(--text-secondary);">პირადი ფოტო (მხოლოდ ამ მოწყობილობაზე)</label>
            <span class="text-[10px] px-2 py-0.5 rounded-full bg-emerald-500/15 text-emerald-400">არ იგზავნება ლინკით</span>
          </div>

          <div class="flex items-center gap-3">
            <!-- ფოტოს პრევიუ -->
            <div id="photoPreviewBox" class="w-14 h-14 rounded-2xl theme-input flex items-center justify-center overflow-hidden shrink-0">
              <svg class="w-6 h-6 opacity-40" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 001.5-1.5V6a1.5 1.5 0 00-1.5-1.5H3.75A1.5 1.5 0 002.25 6v12a1.5 1.5 0 001.5 1.5zm10.5-11.25h.008v.008h-.008V8.25zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" />
              </svg>
            </div>

            <div class="flex flex-col gap-1.5 flex-1">
              <label class="px-3 py-2 rounded-xl theme-pill text-xs font-medium text-center cursor-pointer hover:border-emerald-500/50 transition-colors">
                ფოტოს არჩევა გალერეიდან
                <input id="localPhotoInput" type="file" accept="image/*" class="hidden" onchange="handleLocalPhotoSelect(event)" />
              </label>
              <button type="button" id="removePhotoBtn" onclick="clearLocalPhotoSelection()" class="hidden px-3 py-1.5 rounded-xl text-xs font-medium text-red-400 hover:bg-red-500/10 text-center cursor-pointer">
                ფოტოს წაშლა
              </button>
            </div>
          </div>
        </div>

        <!-- მოქმედების ღილაკები -->
        <div class="flex items-center gap-2 pt-2">
          <button type="button" id="deleteItemBtn" onclick="deleteCurrentEditingItem()" class="hidden px-3.5 py-2.5 rounded-xl bg-red-500/15 text-red-400 hover:bg-red-500/25 text-xs font-semibold cursor-pointer">
            წაშლა
          </button>
          <button type="button" onclick="closeModal()" class="flex-1 py-2.5 rounded-xl theme-pill text-xs font-semibold cursor-pointer">
            გაუქმება
          </button>
          <button type="submit" class="flex-1 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold cursor-pointer shadow-lg shadow-emerald-600/20">
            შენახვა
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- შეტყობინების ტოსტი -->
  <div id="toast">ლინკი დაკოპირდა!</div>

  <script>
    /**
     * 1. ფერების პალიტრა (ზუსტად სქრინის ესთეტიკით)
     */
    const FOLDER_COLORS = [
      { id: 'emerald', hex: '#10b981', bg: 'rgba(16, 185, 129, 0.14)' },
      { id: 'blue',    hex: '#3b82f6', bg: 'rgba(59, 130, 246, 0.14)' },
      { id: 'pink',    hex: '#ec4899', bg: 'rgba(236, 72, 153, 0.14)' },
      { id: 'slate',   hex: '#e2e8f0', bg: 'rgba(226, 232, 240, 0.14)' },
      { id: 'amber',   hex: '#f59e0b', bg: 'rgba(245, 158, 11, 0.14)' },
      { id: 'purple',  hex: '#a855f7', bg: 'rgba(168, 85, 247, 0.14)' },
      { id: 'red',     hex: '#ef4444', bg: 'rgba(239, 68, 68, 0.14)' },
      { id: 'cyan',    hex: '#06b6d4', bg: 'rgba(6, 182, 212, 0.14)' }
    ];

    /**
     * 2. IndexedDB — ლოკალური სურათების შესანახად (მხოლოდ მომხმარებლის დევაისზე)
     */
    const DB_NAME = 'ImperiaLocalImagesDB';
    const STORE_NAME = 'images';
    let dbInstance = null;
    const localPhotoCache = {}; // memory cache: { itemId: dataUrl }

    function initIndexedDB() {
      return new Promise((resolve) => {
        try {
          const request = indexedDB.open(DB_NAME, 1);
          request.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(STORE_NAME)) {
              db.createObjectStore(STORE_NAME);
            }
          };
          request.onsuccess = (e) => {
            dbInstance = e.target.result;
            loadAllLocalImages().then(resolve);
          };
          request.onerror = () => resolve();
        } catch (err) {
          resolve();
        }
      });
    }

    function loadAllLocalImages() {
      return new Promise((resolve) => {
        if (!dbInstance) return resolve();
        try {
          const tx = dbInstance.transaction(STORE_NAME, 'readonly');
          const store = tx.objectStore(STORE_NAME);
          const req = store.openCursor();
          req.onsuccess = (e) => {
            const cursor = e.target.result;
            if (cursor) {
              localPhotoCache[cursor.key] = cursor.value;
              cursor.continue();
            } else {
              resolve();
            }
          };
          req.onerror = () => resolve();
        } catch (err) {
          resolve();
        }
      });
    }

    function saveLocalImageToDB(itemId, dataUrl) {
      return new Promise((resolve) => {
        if (!dataUrl) {
          delete localPhotoCache[itemId];
          if (!dbInstance) return resolve();
          const tx = dbInstance.transaction(STORE_NAME, 'readwrite');
          tx.objectStore(STORE_NAME).delete(itemId);
          tx.oncomplete = () => resolve();
          return;
        }
        localPhotoCache[itemId] = dataUrl;
        if (!dbInstance) return resolve();
        const tx = dbInstance.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).put(dataUrl, itemId);
        tx.oncomplete = () => resolve();
      });
    }

    // სურათის შეკუმშვა IndexedDB-სთვის, რომ ტელეფონის მეხსიერება არ გადატვირთოს
    function compressImageFile(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_SIZE = 480;
            let w = img.width;
            let h = img.height;
            if (w > h && w > MAX_SIZE) {
              h = Math.round((h * MAX_SIZE) / w);
              w = MAX_SIZE;
            } else if (h > MAX_SIZE) {
              w = Math.round((w * MAX_SIZE) / h);
              h = MAX_SIZE;
            }
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/webp', 0.82));
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    /**
     * 3. აპლიკაციის მდგომარეობა (State) და სტარტერ კატეგორიები
     */
    const DEFAULT_ITEMS = [
      { id: 'c1', type: 'folder', title: 'მშენებლობა', color: 'emerald', likes: 0, items: [] },
      {
        id: 'c2', type: 'folder', title: 'მუსიკა', color: 'blue', likes: 0,
        items: [
          { id: 'l21', type: 'link', title: 'YouTube Music', url: 'https://music.youtube.com', color: 'red', likes: 0 }
        ]
      },
      { id: 'c3', type: 'folder', title: 'ფილმი', color: 'pink', likes: 0, items: [] },
      {
        id: 'c4', type: 'folder', title: 'სოფელი', color: 'slate', likes: 0,
        items: [
          { id: 'l41', type: 'link', title: 'ამინდი', url: 'https://amindi.ge', color: 'cyan', likes: 0 }
        ]
      },
      { id: 'c5', type: 'folder', title: 'სწავლა', color: 'amber', likes: 0, items: [] },
      {
        id: 'c6', type: 'folder', title: 'სპორტი', color: 'purple', likes: 0,
        items: [
          { id: 'l61', type: 'link', title: 'Flashscore', url: 'https://www.flashscore.com', color: 'emerald', likes: 0 },
          { id: 'l62', type: 'link', title: 'Setanta Sports', url: 'https://setantasports.com', color: 'amber', likes: 0 }
        ]
      },
      { id: 'c7', type: 'folder', title: 'ფავორიტები', color: 'pink', likes: 0, items: [] }
    ];

    let appState = {
      items: [],
      currentPath: [], // კატეგორიების ID-ების გზა (მაგ: ['c2'] ან ['c2', 'sub1'])
      searchQuery: '',
      gridCols: 4,     // 4, 3 ან 2
      theme: 'dark'    // 'dark' ან 'light'
    };

    // მოდალის დროებითი ცვლადები
    let editingItemId = null;
    let modalType = 'folder';
    let selectedColor = 'emerald';
    let pendingLocalPhotoData = undefined; // undefined = უცვლელი, null = წაშლილი, string = ახალი ფოტო

    /**
     * 4. URL Hash (#data=...) სერიალიზაცია და სინქრონიზაცია
     */
    function encodeStateToHash(items) {
      try {
        const jsonStr = JSON.stringify(items);
        if (window.LZString) {
          return LZString.compressToEncodedURIComponent(jsonStr);
        }
        return btoa(encodeURIComponent(jsonStr));
      } catch (e) {
        return '';
      }
    }

    function decodeStateFromHash(hashStr) {
      try {
        const clean = hashStr.replace(/^#data=/, '');
        if (!clean) return null;
        let jsonStr = null;
        if (window.LZString) {
          jsonStr = LZString.decompressFromEncodedURIComponent(clean);
        }
        if (!jsonStr) {
          jsonStr = decodeURIComponent(atob(clean));
        }
        const parsed = JSON.parse(jsonStr);
        return Array.isArray(parsed) ? parsed : null;
      } catch (e) {
        return null;
      }
    }

    function syncState() {
      // 1. შენახვა localStorage-ში
      try {
        localStorage.setItem('imperia_items_v1', JSON.stringify(appState.items));
        localStorage.setItem('imperia_prefs_v1', JSON.stringify({
          gridCols: appState.gridCols,
          theme: appState.theme
        }));
      } catch (e) {}

      // 2. რეალურ დროში URL-ის განახლება (მხოლოდ მონაცემები, ლოკალური სურათების გარეშე!)
      const compressed = encodeStateToHash(appState.items);
      if (compressed) {
        try {
          history.replaceState(null, '', '#data=' + compressed);
        } catch (e) {
          window.location.hash = 'data=' + compressed;
        }
      }
    }

    function loadInitialState() {
      // პარამეტრების აღდგენა (თემა და ბადის ზომა)
      try {
        const prefs = JSON.parse(localStorage.getItem('imperia_prefs_v1') || '{}');
        if ([2, 3, 4].includes(prefs.gridCols)) appState.gridCols = prefs.gridCols;
        if (prefs.theme === 'light' || prefs.theme === 'dark') appState.theme = prefs.theme;
      } catch (e) {}

      applyThemeUI();
      applyGridColsUI();

      // პირველ რიგში ვამოწმებთ URL-ს (#data=...), რომ გაზიარებული ლინკი პირდაპირ გაიხსნას
      if (window.location.hash && window.location.hash.startsWith('#data=')) {
        const fromUrl = decodeStateFromHash(window.location.hash);
        if (fromUrl) {
          appState.items = fromUrl;
          document.getElementById('sharedNotice').classList.remove('hidden');
          document.getElementById('sharedNotice').classList.add('flex');
          syncState();
          return;
        }
      }

      // თუ URL ცარიელია, ვკითხულობთ localStorage-დან
      try {
        const saved = localStorage.getItem('imperia_items_v1');
        if (saved) {
          const parsed = JSON.parse(saved);
          if (Array.isArray(parsed)) {
            appState.items = parsed;
            syncState();
            return;
          }
        }
      } catch (e) {}

      // თუ საერთოდ პირველად შედის მომხმარებელი, ვსვამთ საწყის კატეგორიებს
      appState.items = JSON.parse(JSON.stringify(DEFAULT_ITEMS));
      syncState();
    }

    /**
     * 5. ნავიგაცია და დამხმარე ფუნქციები ხის სტრუქტურისთვის
     */
    function getCurrentFolder() {
      let currentList = appState.items;
      let folder = null;
      for (const id of appState.currentPath) {
        folder = currentList.find(item => item.id === id && item.type === 'folder');
        if (!folder) {
          appState.currentPath = [];
          return null;
        }
        if (!Array.isArray(folder.items)) folder.items = [];
        currentList = folder.items;
      }
      return folder;
    }

    function getActiveItemsList() {
      const folder = getCurrentFolder();
      return folder ? folder.items : appState.items;
    }

    function openFolder(folderId) {
      appState.currentPath.push(folderId);
      appState.searchQuery = '';
      document.getElementById('searchInput').value = '';
      render();
    }

    function navigateUp() {
      if (appState.currentPath.length > 0) {
        appState.currentPath.pop();
        render();
      }
    }

    function navigateToRoot() {
      appState.currentPath = [];
      render();
    }

    function getColorObj(colorId) {
      return FOLDER_COLORS.find(c => c.id === colorId) || FOLDER_COLORS[0];
    }

    function extractDomain(url) {
      try {
        const u = new URL(url.startsWith('http') ? url : 'https://' + url);
        return u.hostname.replace(/^www\./, '');
      } catch (e) {
        return url;
      }
    }

    function normalizeUrl(url) {
      const trimmed = url.trim();
      if (!trimmed) return 'https://example.com';
      if (/^https?:\/\//i.test(trimmed)) return trimmed;
      return 'https://' + trimmed;
    }

    /**
     * 6. ეკრანის დახატვა (Render)
     */
    function render() {
      const gridEl = document.getElementById('itemsGrid');
      const emptyEl = document.getElementById('emptyState');
      const breadcrumbBar = document.getElementById('breadcrumbBar');
      const breadcrumbTrail = document.getElementById('breadcrumbTrail');

      // Breadcrumb განახლება
      if (appState.currentPath.length > 0) {
        breadcrumbBar.classList.remove('hidden');
        breadcrumbBar.classList.add('flex');

        let trailHtml = `<button onclick="navigateToRoot()" class="hover:text-emerald-500 cursor-pointer">მთავარი</button>`;
        let list = appState.items;
        appState.currentPath.forEach((id, idx) => {
          const f = list.find(x => x.id === id);
          if (f) {
            trailHtml += `<span>/</span><span class="${idx === appState.currentPath.length - 1 ? 'font-bold text-emerald-500' : ''}">${escapeHtml(f.title)}</span>`;
            list = f.items || [];
          }
        });
        breadcrumbTrail.innerHTML = trailHtml;
      } else {
        breadcrumbBar.classList.add('hidden');
        breadcrumbBar.classList.remove('flex');
      }

      // ელემენტების გაფილტვრა ძიებით
      let itemsToShow = getActiveItemsList();
      if (appState.searchQuery.trim() !== '') {
        const q = appState.searchQuery.toLowerCase();
        itemsToShow = collectMatchingItems(appState.items, q);
      }

      if (itemsToShow.length === 0) {
        gridEl.innerHTML = '';
        emptyEl.classList.remove('hidden');
        return;
      }

      emptyEl.classList.add('hidden');
      gridEl.innerHTML = itemsToShow.map(item => renderCardHTML(item)).join('');
    }

    function collectMatchingItems(list, query) {
      let matches = [];
      for (const item of list) {
        const titleMatch = (item.title || '').toLowerCase().includes(query);
        const urlMatch = (item.url || '').toLowerCase().includes(query);
        if (titleMatch || urlMatch) {
          matches.push(item);
        }
        if (item.type === 'folder' && Array.isArray(item.items)) {
          matches = matches.concat(collectMatchingItems(item.items, query));
        }
      }
      return matches;
    }

    function renderCardHTML(item) {
      const colorObj = getColorObj(item.color);
      const localPhoto = localPhotoCache[item.id];
      const isFolder = item.type === 'folder';
      const childCount = isFolder && Array.isArray(item.items) ? item.items.length : 0;
      const likes = item.likes || 0;

      // ბარათის შიდა ვიზუალი: თუ ლოკალური ფოტო აქვს მომხმარებელს — ვაჩვენებთ ფოტოს, თუ არა — ფოლდერის/საიტის აიქონს
      let innerVisual = '';
      if (localPhoto) {
        innerVisual = `<img src="${localPhoto}" alt="${escapeHtml(item.title)}" class="w-full h-full object-cover" />`;
      } else if (isFolder) {
        innerVisual = `

              <path d="M19.5 21a3 3 0 003-3v-4.5a3 3 0 00-3-3h-15a3 3 0 00-3 3V18a3 3 0 003 3h15zM1.5 10.146V6a3 3 0 013-3h5.379a2.25 2.25 0 011.59.659l2.122 2.121c.14.141.331.22.53.22H19.5a3 3 0 013 3v1.146A4.483 4.483 0 0019.5 9h-15a4.483 4.483 0 00-3 1.146z" />

      } else {
        const domain = extractDomain(item.url || '');
        const faviconUrl = `https://www.google.com/s2/favicons?sz=128&domain=${encodeURIComponent(domain)}`;
        innerVisual = `
          <div class="flex flex-col items-center justify-center w-full h-full p-2 gap-1.5">
            <div class="w-10 h-10 rounded-full flex items-center justify-center overflow-hidden shadow-inner" style="background-color: ${colorObj.bg};">
              <img src="${faviconUrl}" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" class="w-6 h-6 object-contain rounded-full" alt="" />
              <svg style="display:none; color: ${colorObj.hex};" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 21a9.004 9.004 0 008.716-6.747M12 21a9.004 9.004 0 01-8.716-6.747M12 21c2.485 0 4.5-4.03 4.5-9S14.485 3 12 3m0 18c-2.485 0-4.5-4.03-4.5-9S9.515 3 12 3m0 0a8.997 8.997 0 017.843 4.582M12 3a8.997 8.997 0 00-7.843 4.582m15.686 0A11.953 11.953 0 0112 10.5c-2.998 0-5.74-1.1-7.843-2.918m15.686 0A8.959 8.959 0 0121 12c0 .778-.099 1.533-.284 2.253m0 0A17.919 17.919 0 0112 16.5c-3.162 0-6.133-.815-8.716-2.247m0 0A9.015 9.015 0 013 12c0-1.605.42-3.113 1.157-4.418" />
              </svg>
            </div>
            <span class="text-[10px] px-2 py-0.5 rounded-md truncate max-w-[90%]" style="background-color: var(--pill-bg); color: var(--text-secondary);">
              ${escapeHtml(domain)}
            </span>
          </div>
        `;
      }

      // კლიკის მოქმედება (ფოლდერის გახსნა ან ლინკზე გადასვლა)
      const clickAttr = isFolder
        ? `onclick="openFolder('${item.id}')"`
        : `onclick="openExternalLink('${escapeHtml(item.url || '')}')"`;

      return `
        <div class="flex flex-col items-center select-none group">

            <button

            ${isFolder && childCount > 0 ? `
              <span class="absolute bottom-1.5 right-1.5 min-w-[20px] h-5 px-1.5 rounded-full text-[11px] font-bold flex items-center justify-center shadow"

                ${childCount}
              </span>
            ` : ''}

          <!-- სათაური -->

            </svg>
            <span>${likes}</span>
          </button>
        </div>
      `;
    }

    /**
     * 7. ინტერაქციები: ლაიქი, ბადის ზომა, დღე/ღამე, გაზიარება
     */
    function findItemByIdRecursive(list, id) {
      for (const item of list) {
        if (item.id === id) return item;
        if (item.type === 'folder' && Array.isArray(item.items)) {
          const found = findItemByIdRecursive(item.items, id);
          if (found) return found;
        }
      }
      return null;
    }

    function incrementLike(itemId) {
      const item = findItemByIdRecursive(appState.items, itemId);
      if (item) {
        item.likes = (item.likes || 0) + 1;
        syncState();
        render();
      }
    }

    function openExternalLink(url) {
      if (!url) return;
      window.open(normalizeUrl(url), '_blank', 'noopener,noreferrer');
    }

    function handleSearch(val) {
      appState.searchQuery = val;
      render();
    }

    // ბადის სვეტების შეცვლა: 4 -> 3 -> 2 -> 4
    function cycleGridCols() {
      if (appState.gridCols === 4) appState.gridCols = 3;
      else if (appState.gridCols === 3) appState.gridCols = 2;
      else appState.gridCols = 4;

      applyGridColsUI();
      syncState();
    }

    function applyGridColsUI() {
      const gridEl = document.getElementById('itemsGrid');
      const labelEl = document.getElementById('gridColLabel');
      gridEl.classList.remove('cols-3', 'cols-2');
      if (appState.gridCols === 3) gridEl.classList.add('cols-3');
      if (appState.gridCols === 2) gridEl.classList.add('cols-2');
      labelEl.textContent = appState.gridCols;
    }

    // დღის და ღამის რეჟიმი
    function toggleTheme() {
      appState.theme = appState.theme === 'dark' ? 'light' : 'dark';
      applyThemeUI();
      syncState();
    }

    function applyThemeUI() {
      const htmlEl = document.documentElement;
      const sunIcon = document.getElementById('sunIcon');
      const moonIcon = document.getElementById('moonIcon');

      if (appState.theme === 'light') {
        htmlEl.classList.add('light-theme');
        sunIcon.classList.add('hidden');
        moonIcon.classList.remove('hidden');
      } else {
        htmlEl.classList.remove('light-theme');
        sunIcon.classList.remove('hidden');
        moonIcon.classList.add('hidden');
      }
    }

    // ლინკის კოპირება (execCommand fallback-ით iFrame-სთვის)
    function copyShareLink() {
      syncState();
      const fullUrl = window.location.href;
      const tempInput = document.createElement('input');
      tempInput.value = fullUrl;
      document.body.appendChild(tempInput);
      tempInput.select();
      tempInput.setSelectionRange(0, 99999);
      try {
        document.execCommand('copy');
        showToast('იმპერიის ლინკი დაკოპირდა! შეგიძლია გაუგზავნო სხვას');
      } catch (err) {
        showToast('ლინკი მზადაა მისამართის ზოლში');
      }
      document.body.removeChild(tempInput);
    }

    function resetToBlank() {
      appState.items = [];
      appState.currentPath = [];
      document.getElementById('sharedNotice').classList.add('hidden');
      syncState();
      render();
      showToast('გვერდი გასუფთავდა — შეგიძლია ააწყო ახალი');
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => {
        toast.classList.remove('show');
      }, 2800);
    }

    /**
     * 8. მოდალური ფანჯარა (შექმნა, რედაქტირება, ლოკალური ფოტოს მიბმა, წაშლა)
     */
    function renderColorPalette() {
      const wrap = document.getElementById('colorPalette');
      wrap.innerHTML = FOLDER_COLORS.map(c => `
        <button
          type="button"
          onclick="selectPaletteColor('${c.id}')"
          class="w-7 h-7 rounded-full transition-transform cursor-pointer flex items-center justify-center ${selectedColor === c.id ? 'scale-115 ring-2 ring-offset-2 ring-emerald-500' : 'opacity-80 hover:opacity-100'}"
          style="background-color: ${c.hex};"
        >
          ${selectedColor === c.id ? '<span class="w-2 h-2 rounded-full bg-white"></span>' : ''}
        </button>
      `).join('');
    }

    function selectPaletteColor(colorId) {
      selectedColor = colorId;
      renderColorPalette();
    }

    function setModalType(type) {
      modalType = type;
      const folderBtn = document.getElementById('typeFolderBtn');
      const linkBtn = document.getElementById('typeLinkBtn');
      const urlWrap = document.getElementById('urlFieldWrap');
      const urlInput = document.getElementById('itemUrlInput');

      if (type === 'folder') {
        folderBtn.className = 'py-2 rounded-xl text-xs font-semibold transition-all cursor-pointer bg-emerald-600 text-white';
        linkBtn.className = 'py-2 rounded-xl text-xs font-semibold transition-all cursor-pointer';
        linkBtn.style.color = 'var(--text-secondary)';
        urlWrap.classList.add('hidden');
        urlInput.required = false;
      } else {
        linkBtn.className = 'py-2 rounded-xl text-xs font-semibold transition-all cursor-pointer bg-emerald-600 text-white';
        folderBtn.className = 'py-2 rounded-xl text-xs font-semibold transition-all cursor-pointer';
        folderBtn.style.color = 'var(--text-secondary)';
        urlWrap.classList.remove('hidden');
        urlInput.required = true;
      }
    }

    function openCreateModal() {
      editingItemId = null;
      pendingLocalPhotoData = undefined;
      selectedColor = FOLDER_COLORS[Math.floor(Math.random() * FOLDER_COLORS.length)].id;

      document.getElementById('modalTitle').textContent = appState.currentPath.length > 0 ? 'ქვეკატეგორია ან ლინკი' : 'ახალი კატეგორია ან ლინკი';
      document.getElementById('typeSelectorWrap').classList.remove('hidden');
      document.getElementById('deleteItemBtn').classList.add('hidden');
      document.getElementById('itemTitleInput').value = '';
      document.getElementById('itemUrlInput').value = '';
      document.getElementById('localPhotoInput').value = '';

      updatePhotoPreviewUI(null);
      setModalType(appState.currentPath.length > 0 ? 'link' : 'folder');
      renderColorPalette();

      const modal = document.getElementById('itemModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      setTimeout(() => document.getElementById('itemTitleInput').focus(), 60);
    }

    function openEditModal(itemId) {
      const item = findItemByIdRecursive(appState.items, itemId);
      if (!item) return;

      editingItemId = item.id;
      pendingLocalPhotoData = undefined;
      selectedColor = item.color || 'emerald';

      document.getElementById('modalTitle').textContent = 'რედაქტირება';
      document.getElementById('typeSelectorWrap').classList.add('hidden');
      document.getElementById('deleteItemBtn').classList.remove('hidden');
      document.getElementById('itemTitleInput').value = item.title || '';
      document.getElementById('itemUrlInput').value = item.url || '';
      document.getElementById('localPhotoInput').value = '';

      setModalType(item.type);
      updatePhotoPreviewUI(localPhotoCache[item.id] || null);
      renderColorPalette();

      const modal = document.getElementById('itemModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeModal() {
      const modal = document.getElementById('itemModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    async function handleLocalPhotoSelect(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      try {
        const compressedDataUrl = await compressImageFile(file);
        pendingLocalPhotoData = compressedDataUrl;
        updatePhotoPreviewUI(compressedDataUrl);
      } catch (e) {
        showToast('ფოტოს დამუშავება ვერ მოხერხდა');
      }
    }

    function clearLocalPhotoSelection() {
      pendingLocalPhotoData = null;
      document.getElementById('localPhotoInput').value = '';
      updatePhotoPreviewUI(null);
    }

    function updatePhotoPreviewUI(dataUrl) {
      const box = document.getElementById('photoPreviewBox');
      const removeBtn = document.getElementById('removePhotoBtn');

      if (dataUrl) {
        box.innerHTML = `<img src="${dataUrl}" class="w-full h-full object-cover" alt="პრევიუ" />`;
        removeBtn.classList.remove('hidden');
      } else {
        box.innerHTML = `
          <svg class="w-6 h-6 opacity-40" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 001.5-1.5V6a1.5 1.5 0 00-1.5-1.5H3.75A1.5 1.5 0 002.25 6v12a1.5 1.5 0 001.5 1.5zm10.5-11.25h.008v.008h-.008V8.25zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" />
          </svg>
        `;
        removeBtn.classList.add('hidden');
      }
    }

    async function saveItemForm(e) {
      e.preventDefault();
      const title = document.getElementById('itemTitleInput').value.trim();
      const urlVal = document.getElementById('itemUrlInput').value.trim();
      if (!title) return;

      if (editingItemId) {
        // არსებულის განახლება
        const item = findItemByIdRecursive(appState.items, editingItemId);
        if (item) {
          item.title = title;
          item.color = selectedColor;
          if (item.type === 'link') {
            item.url = normalizeUrl(urlVal);
          }
          if (pendingLocalPhotoData !== undefined) {
            await saveLocalImageToDB(item.id, pendingLocalPhotoData);
          }
        }
      } else {
        // ახლის შექმნა
        const newId = 'id_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
        const newItem = {
          id: newId,
          type: modalType,
          title: title,
          color: selectedColor,
          likes: 0
        };
        if (modalType === 'folder') {
          newItem.items = [];
        } else {
          newItem.url = normalizeUrl(urlVal);
        }

        const targetList = getActiveItemsList();
        targetList.push(newItem);

        if (pendingLocalPhotoData) {
          await saveLocalImageToDB(newId, pendingLocalPhotoData);
        }
      }

      syncState();
      render();
      closeModal();
    }

    async function deleteCurrentEditingItem() {
      if (!editingItemId) return;
      removeItemFromTree(appState.items, editingItemId);
      await saveLocalImageToDB(editingItemId, null);
      syncState();
      render();
      closeModal();
      showToast('წაიშალა');
    }

    function removeItemFromTree(list, id) {
      const idx = list.findIndex(x => x.id === id);
      if (idx !== -1) {
        list.splice(idx, 1);
        return true;
      }
      for (const item of list) {
        if (item.type === 'folder' && Array.isArray(item.items)) {
          if (removeItemFromTree(item.items, id)) return true;
        }
      }
      return false;
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // გაშვება ჩატვირთვისას
    window.addEventListener('DOMContentLoaded', async () => {
      await initIndexedDB();
      loadInitialState();
      render();
    });

    // თუ მომხმარებელმა ბრაუზერში ხელით შეცვალა hash ლინკი
    window.addEventListener('hashchange', () => {
      if (window.location.hash && window.location.hash.startsWith('#data=')) {
        const fromUrl = decodeStateFromHash(window.location.hash);
        if (fromUrl) {
          appState.items = fromUrl;
          appState.currentPath = [];
          render();
        }
      }
    });
  </script>
</body>
</html>
